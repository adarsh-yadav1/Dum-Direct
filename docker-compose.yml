# Local stack: PostgreSQL, Redis and one app container that serves the web app and the API
# together on http://localhost:8000. Values come from a local .env file (copy .env.example).
# The defaults below are for local use only and must never be used in a deployed environment.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dumdirect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-dumdirect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dumdirect}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-dumdirect}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-dumdirect-demo-2026}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
