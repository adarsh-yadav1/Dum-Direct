# One-click deployment on Render: a Postgres database, a Redis instance and one web service
# that serves the web app and the API from a single address. Environment variable names only
# are listed here; secrets are generated by the platform, never stored in this repository.
databases:
  - name: dumdirect-db
    databaseName: dumdirect
    user: dumdirect
    plan: free

services:
  - type: keyvalue
    name: dumdirect-redis
    plan: free
    ipAllowList: []          # reachable only from services in this account

  - type: web
    name: dumdirect
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: dumdirect-demo-2026
      - key: DATABASE_URL
        fromDatabase:
          name: dumdirect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dumdirect-redis
          property: connectionString
